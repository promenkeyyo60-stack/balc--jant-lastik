packages:
  "framer-motion": "For the smooth wheel spinning animation and UI transitions"
  "canvas-confetti": "To celebrate the winner of the league"
  "@types/canvas-confetti": "Types for canvas-confetti"
  "lucide-react": "Base icon set"
  "clsx": "Utility for constructing className strings conditionally"
  "tailwind-merge": "Utility function to efficiently merge Tailwind CSS classes in JS"

images:
  - path: "artifacts/draft-game/public/images/stadium-bg.png"
    description: "A dark, moody, cinematic football stadium at night with glowing floodlights illuminating a perfectly cut green grass pitch. High contrast, atmospheric, dramatic lighting, empty stands in the background."
    aspect_ratio: "16:9"
  - path: "artifacts/draft-game/public/images/wheel-center.png"
    description: "A sleek, metallic silver and black circular logo with a subtle glowing neon green football in the center. Used as the center cap for a spinning wheel."
    aspect_ratio: "1:1"

notes:
  - No backend is required. This is a fully client-side state-driven application.
  - Using complex state to manage phases: Setup -> Draft -> League.
