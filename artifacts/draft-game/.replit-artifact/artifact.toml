kind = "web"
previewPath = "/"
title = "Draft Football Game"
version = "1.0.0"
id = "artifacts/draft-game"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26259

[services.development]
run = "pnpm --filter @workspace/draft-game run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/draft-game", "run", "build" ]
publicDir = "artifacts/draft-game/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26259"
BASE_PATH = "/"
